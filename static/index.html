<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/static/manifest.webmanifest">
<title>WebDesk</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/kb.css">
</head>
<body>
<!-- 屏幕画面：canvas=JPEG 通道，video=WebRTC/H.264 通道 -->
<canvas id="screen" class="scr"></canvas>
<video id="screen-video" class="scr" playsinline muted></video>
<audio id="remote-audio" autoplay playsinline></audio>
<div id="status" data-i18n="st_connecting">连接中…</div>

<!-- 自定义控件层（摇杆/按钮） -->
<div id="controls"></div>

<!-- 左上角：切到键盘模式（独立按钮，不与右上工具栏混排） -->
<button id="btn-kbpage" data-i18n="btn_keyboard_mode" data-i18n-title="tip_keyboard_mode">键盘模式</button>

<!-- 顶部工具栏（闲置自动变淡，防误触） -->
<div id="toolbar">
  <button id="btn-lang" class="wd-lang-btn" data-i18n="lang_other" data-i18n-title="lang_tip">EN</button>
  <button id="btn-input" data-i18n="guard_off" data-i18n-title="tip_guard">防误触:关</button>
  <button id="btn-audio" data-i18n="audio_off" data-i18n-title="tip_audio">音频:关</button>
  <button id="btn-edit" data-i18n="btn_edit" data-i18n-title="tip_edit">编辑</button>
  <button id="btn-full" data-i18n="btn_full" data-i18n-title="tip_full">全屏</button>
</div>

<!-- 画面缩放（控件按钮不随画面缩放） -->
<div id="zoombar">
  <button id="zoom-in" data-i18n="zoom_in" data-i18n-title="tip_zoom_in">放大</button>
  <button id="zoom-out" data-i18n="zoom_out" data-i18n-title="tip_zoom_out">缩小</button>
  <button id="zoom-reset" data-i18n="zoom_reset" data-i18n-title="tip_zoom_reset">还原</button>
</div>

<!-- 编辑模式工具栏 -->
<div id="editbar" class="hidden">
  <button id="add-btn" data-i18n="add_button">＋按钮</button>
  <button id="add-stick" data-i18n="add_stick">＋摇杆</button>
  <button id="done-edit" data-i18n="done_edit">完成</button>
</div>

<!-- 控件属性编辑弹窗 -->
<div id="prop-dialog" class="hidden">
  <div id="prop-box">
    <h3 data-i18n="prop_title">控件属性</h3>
    <div id="prop-fields"></div>
    <div class="prop-actions">
      <button id="prop-del" class="danger" data-i18n="prop_del">删除</button>
      <span></span>
      <button id="prop-cancel" data-i18n="prop_cancel">取消</button>
      <button id="prop-ok" class="primary" data-i18n="prop_ok">确定</button>
    </div>
  </div>
</div>

<!-- ================= 键盘触摸板视图（同页覆盖式切换，不新开标页） =================
     与画面共用同一条 WebSocket：切到键盘时服务端停推画面（mode=none），零视频带宽 -->
<div id="kbview" class="hidden">
  <header>
    <span id="lamp" class="off"></span>
    <span id="st" data-i18n="st_connecting">连接中…</span>
    <span id="pos"></span>
    <button id="kb-lang" class="wd-lang-btn" data-i18n="lang_other" data-i18n-title="lang_tip">EN</button>
    <a id="go-screen" href="#" role="button" data-i18n="kb_touch_mode">触屏模式</a>
  </header>

  <div id="tp">
    <div id="tp-hint" data-i18n="kb_tp_hint">单指拖动移光标 · 轻点=左键 · 长按=右键 · 双指轻点=双击 · 双指拖动=滚轮</div>
    <canvas id="mm" width="144" height="82"></canvas>
  </div>

  <div id="mrow">
    <button data-a="esc">Esc</button>
    <button data-a="left" data-i18n="mr_left">左键</button>
    <button data-a="right" data-i18n="mr_right">右键</button>
    <button data-a="dbl" data-i18n="mr_dbl">双击</button>
    <button data-a="wu" data-i18n="mr_wu">滚轮↑</button>
    <button data-a="wd" data-i18n="mr_wd">滚轮↓</button>
  </div>

  <div id="kb"></div>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/net.js"></script>
<script src="/static/js/widgets.js"></script>
<script src="/static/js/kb.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
